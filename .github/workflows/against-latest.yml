# Once a day, against the Codex the marketplace is shipping now.
#
# This is the one check that can go red without anything in this repository having changed: Codex publishes a build
# whose extension host bundle no longer matches an edit of the patch, and the patch then silently does nothing for
# everyone who updates. test/against-latest.js downloads that build, unpacks only the two patched files and applies
# every edit to them.
#
# The exit code is left to fail the step. 1 is an edit that no longer matches exactly once, or a patched file that no
# longer parses; anything else is the check not having run at all, which is also worth a red run, because a check that
# quietly stopped working reads the same as one that keeps passing.
#
# A failure of the build itself (exit 1) also goes into an issue naming the Codex version and quoting the lines that
# failed, so it is seen without anyone opening the runs. A version has at most one issue: a later failure reopens it if
# it was closed, and a later pass against the same version closes it, naming the commit the check passed on. A check
# that could not run (exit 2) leaves every issue as it is: it says nothing about the build. Run by hand with
# issue_preview, the workflow only writes in the run's summary what it would do to the issue.
#
# A Codex release that is simply not in src/supported-versions.json is not a failure and prints as a note: the edits
# matching a build is not the whole of what that file claims, and only a machine with that Codex installed can
# establish the rest.
name: against-latest

on:
  schedule:
    # 06:17 UTC. Not on the hour, which is when the scheduler is busiest and runs are likeliest to be dropped.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      issue_preview:
        description: Say in the run's summary what this run would do to the issue of its Codex version, and do nothing
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  against-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: node test/against-latest.js
        id: latest
        run: |
          set -o pipefail
          code=0
          node test/against-latest.js 2>&1 | tee report.txt || code=$?
          version=$(sed -n 's/^openai\.chatgpt \([^ ]*\).*/\1/p' report.txt | head -n 1)
          { echo "code=$code"; echo "version=$version"; } >> "${GITHUB_OUTPUT:-/dev/null}"
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -eq 1 ]; then
            echo "::error::An edit of the patch no longer fits the Codex being shipped. src/host.js or src/webview-inject.js needs updating before anyone's Codex updates."
          else
            echo "::error::The check did not run (exit $code), so whether the patch still fits is unknown."
          fi
          exit "$code"

      - name: Put the report in the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Against the latest Codex'
            if [ "${{ steps.latest.outputs.code }}" != '0' ] && [ "${{ steps.latest.outputs.code }}" != '1' ]; then
              echo 'The check could not run, so it says nothing about the build.'
            fi
            echo '```'
            cat report.txt || echo 'the check produced no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open, or close, the issue of this Codex version
        if: always() && (steps.latest.outputs.code == '0' || steps.latest.outputs.code == '1')
        uses: actions/github-script@v9
        env:
          CODE: ${{ steps.latest.outputs.code }}
          VERSION: ${{ steps.latest.outputs.version }}
          PREVIEW: ${{ inputs.issue_preview }}
        with:
          script: |
            const fs = require('fs');
            const passed = process.env.CODE === '0';
            const version = process.env.VERSION || '';
            const preview = process.env.PREVIEW === 'true';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const commit = `[${context.sha.slice(0, 7)}](${context.serverUrl}/${repo.owner}/${repo.repo}/commit/${context.sha})`;
            const title = `Codex ${version || 'an unknown build'} failed the check against the latest Codex`;
            const said = [];
            const act = async (what, fn) => { said.push(what); core.info(what); if (!preview) await fn(); };
            const done = async () => {
              if (preview) await core.summary.addHeading('What this run does to the issue of this version', 3).addRaw(said.join('\n\n') || 'Nothing.').write();
            };

            // Closed issues are searched too: the check runs every day, and a version stays the newest for days.
            const all = await github.paginate(github.rest.issues.listForRepo, { ...repo, state: 'all', per_page: 100 });
            const already = all.find((i) => !i.pull_request && i.title === title);

            if (passed) {
              if (!version || !already || already.state !== 'open') {
                said.push(version ? `No open issue is titled "${title}", so none is closed.` : 'The report names no version, so no issue is closed.');
                return done();
              }
              await act(`Closes #${already.number}, saying the check passed on ${context.sha.slice(0, 7)} against Codex ${version}.`, async () => {
                await github.rest.issues.createComment({ ...repo, issue_number: already.number, body: `The check passed on ${commit} against Codex ${version}.` });
                await github.rest.issues.update({ ...repo, issue_number: already.number, state: 'closed', state_reason: 'completed' });
              });
              return done();
            }

            let report = 'the check produced no report';
            try { report = fs.readFileSync('report.txt', 'utf8'); } catch (_) {}
            // An issue body holds at most 65536 characters; the run's summary has the whole report.
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const LIMIT = 40000;
            let failing = report.split('\n').filter((l) => /^FAIL\b|^openai\.chatgpt /.test(l)).join('\n');
            if (failing.length > LIMIT) failing = failing.slice(0, LIMIT) + '\n... cut here; the run summary has every line';

            const body = [
              // GitHub shows each newline of an issue body as a line break, so each paragraph is one string.
              `The daily compatibility check for the Codex Plus patch failed against Codex **${version}**.`,
              '',
              'Each edit in the Codex Plus patch must match exactly once in the Codex file it changes. If an edit does not, or a '
                + 'patched file no longer parses, everyone who updates to that build runs it without the patch. If '
                + '`src/protocol-known.js` omits an app-server request or question tool from the new build, a conversation can wait '
                + 'for the user without Codex Plus ever showing that wait.',
              '',
              '### What the check said',
              '',
              `The lines that failed are below; the whole report is in the summary of [the run](${run}).`,
              '',
              '```',
              failing.trim() || report.trim().slice(-LIMIT),
              '```',
              '',
              '### Where to look',
              '',
              'The edits are in `src/host.js`, `src/webview-inject.js` and `src/manifest.js`, and the lists of requests and '
                + 'question tools in `src/protocol-known.js`. Run `node test/against-latest.js` to reproduce.',
            ].join('\n');

            if (already && already.state === 'open') {
              said.push(`#${already.number} is open for this version already, so it is left as it is.`);
            } else if (already) {
              await act(`Opens #${already.number} again, saying the check failed again on ${context.sha.slice(0, 7)}.`, async () => {
                await github.rest.issues.update({ ...repo, issue_number: already.number, state: 'open' });
                await github.rest.issues.createComment({ ...repo, issue_number: already.number,
                  body: `The check failed again on ${commit} against Codex ${version}; the lines that failed are in the summary of [the run](${run}).` });
              });
            } else {
              await act(`Opens "${title}":\n\n${'```'}markdown\n${body}\n${'```'}`, () => github.rest.issues.create({ ...repo, title, body }));
            }
            return done();
