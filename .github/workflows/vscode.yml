# Codex Plus patches three files of the Codex extension and draws in a VS Code window. Where those files are and how
# the window draws differ between Linux, macOS and Windows, and check.yml runs on Linux only, with neither installed.
# This one installs the newest VS Code and Codex on each of the three and runs the extension in a real window
# (test/vscode/run.js): it drives the window, checks what it shows, and compares crops of this extension's elements with
# the approved copies for that platform. It runs once a day as well as on each push, since either upstream can change
# without a commit here.
#
# The results folder of each platform is kept as an artifact whether the run passed or not: the screenshots of every
# step, the crops, a diff image of each crop that failed, and VS Code's logs. A platform with no approved copies yet
# only saves its crops there, with a note in the log.
name: vscode

on:
  push:
    # Try a change to this workflow on a ci/ branch first.
    branches: [main, 'ci/**']
  pull_request:
  schedule:
    # 07:53 UTC. Not on the hour or the half hour, when the scheduler is busiest, and apart from check.yml (05:41) and
    # against-latest.yml (06:17).
    - cron: '53 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the .vsix
        shell: bash
        run: |
          vsix=$(bash build/pack.sh | tail -n 1)
          mv "$vsix" extension.vsix
      # This extension depends on Agent Plus, so the run installs it too. Checked out after the build above, whose
      # checks read the files under this folder.
      - uses: actions/checkout@v7
        with:
          repository: xnervwang/vscode-agent-plus
          path: agent-plus
      - name: Build Agent Plus's .vsix
        shell: bash
        run: |
          core=$(cd agent-plus && bash build/pack.sh | tail -n 1)
          mv "$core" core.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: |
            extension.vsix
            core.vsix

  run:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Some checks compare source text, so no CRLF on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Install the test runner
        shell: bash
        run: npm install --no-save --no-package-lock @vscode/test-electron@3 playwright-core@1
      # run.js puts the test stage in a user and network namespace of its own, with loopback only. Ubuntu's AppArmor
      # forbids an unprivileged user namespace unless this is 0, and CODEX_PLUS_UI_OFFLINE=require below fails the run
      # when the stage cannot be cut off from the network.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The screen is given the size the approved Linux crops were made at.
      - name: Run in VS Code
        if: runner.os == 'Linux'
        shell: bash
        env:
          CODEX_PLUS_UI_OFFLINE: require
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node test/vscode/run.js extension.vsix core.vsix --out vscode-results
      # macOS and Windows have no namespace to put it in: there the test stage only gets a proxy that does not exist.
      - name: Run in VS Code
        if: runner.os != 'Linux'
        shell: bash
        run: node test/vscode/run.js extension.vsix core.vsix --out vscode-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-${{ runner.os }}
          path: vscode-results
          if-no-files-found: warn
