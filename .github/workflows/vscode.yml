# Codex Plus patches three files of the Codex extension and draws in a VS Code window. Where those files are and how
# the window draws differ between Linux, macOS and Windows, and check.yml runs on Linux only, with neither installed.
# This one installs the newest VS Code and Codex on each of the three and runs the extension in a real window
# (test/vscode/run.js): it drives the window, checks what it shows, and compares crops of this extension's elements with
# the approved copies for that platform. It runs once a day as well as on each push, since either upstream can change
# without a commit here.
#
# The results folder of each platform and shard is kept as an artifact whether the run passed or not: the screenshots
# of every step, the crops, a diff image of each crop that failed, VS Code's logs, and, for a step that failed, the
# window's HTML and text at that moment (its state/ folder). A platform with no approved copies yet only saves its crops
# there, with a note in the log.
name: vscode

on:
  push:
    # Try a change to this workflow on a ci/ branch first.
    branches: [main, 'ci/**']
  pull_request:
  schedule:
    # 07:53 UTC. Not on the hour or the half hour, when the scheduler is busiest, and apart from check.yml (05:41) and
    # against-latest.yml (06:17).
    - cron: '53 7 * * *'
  # By hand: one system or all three, and with `steps` only the window test steps whose names match that regular
  # expression, with the steps they rely on (test/vscode/ui.js stepsToRun). It is for trying a fix of one failure on
  # the system it failed on.
  workflow_dispatch:
    inputs:
      os:
        description: The system to run on
        type: choice
        options: [all, ubuntu-latest, macos-latest, windows-latest]
        default: all
      steps:
        description: A regular expression of window test step names to run; empty runs them all, in shards
        type: string
        default: ''
      agent_plus:
        description: The Agent Plus to build against, the commit in .github/agent-plus-commit or its newest
        type: choice
        options: [pinned, latest]
        default: pinned
      codex:
        description: The Codex to install, the newest in src/supported-versions.json or the newest released
        type: choice
        options: [supported, latest]
        default: supported

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the .vsix
        shell: bash
        run: |
          vsix=$(bash build/pack.sh | tail -n 1)
          mv "$vsix" extension.vsix
      # This extension depends on Agent Plus, so the run installs it too: the commit named in .github/agent-plus-commit,
      # except on the daily run (and by hand with agent_plus latest), which takes Agent Plus's newest commit. Checked
      # out after the build above, whose checks read the files under this folder.
      - name: Which Agent Plus
        id: core
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.agent_plus }}" = latest ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"; echo "Agent Plus: its newest commit"
          else
            ref=$(grep -v '^#' .github/agent-plus-commit | grep -m1 .)
            echo "ref=$ref" >> "$GITHUB_OUTPUT"; echo "Agent Plus: $ref, from .github/agent-plus-commit"
          fi
      - uses: actions/checkout@v7
        with:
          repository: xnervwang/vscode-agent-plus
          ref: ${{ steps.core.outputs.ref }}
          path: agent-plus
      - name: Build Agent Plus's .vsix
        shell: bash
        run: |
          core=$(cd agent-plus && bash build/pack.sh | tail -n 1)
          mv "$core" core.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: |
            extension.vsix
            core.vsix

  # Every step on one machine takes about half an hour, so a full run cuts the steps into the five shards of
  # test/vscode/ui.js SHARD_STARTS and runs them side by side on each system; before its own steps, a shard runs the
  # earlier steps they rely on. A run by hand that gives `steps` has one job per system instead, as shard 0.
  run:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        shard: ${{ fromJSON(inputs.steps && '[0]' || '[1, 2, 3, 4, 5]') }}
    runs-on: ${{ matrix.os }}
    env:
      CODEX_PLUS_UI_STEPS: ${{ inputs.steps }}
      # A push is checked against the newest Codex listed in src/supported-versions.json; the daily run, against the
      # newest Codex released, shows when a new Codex release needs changes in this extension.
      CODEX_PLUS_UI_CODEX: ${{ (github.event_name == 'schedule' || inputs.codex == 'latest') && 'latest' || 'supported' }}
      CODEX_PLUS_UI_SHARD: ${{ matrix.shard != 0 && format('{0}/5', matrix.shard) || '' }}
    steps:
      # Some checks compare source text, so no CRLF on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Install the test runner
        shell: bash
        run: npm install --no-save --no-package-lock @vscode/test-electron@3 playwright-core@1
      # run.js puts the test stage in a user and network namespace of its own, with loopback only. Ubuntu's AppArmor
      # forbids an unprivileged user namespace unless this is 0, and CODEX_PLUS_UI_OFFLINE=require below fails the run
      # when the stage cannot be cut off from the network.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The screen is given the size the approved Linux crops were made at.
      - name: Run in VS Code
        if: runner.os == 'Linux'
        shell: bash
        env:
          CODEX_PLUS_UI_OFFLINE: require
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node test/vscode/run.js extension.vsix core.vsix --out vscode-results
      # macOS and Windows have no namespace to put it in: there the test stage only gets a proxy that does not exist.
      - name: Run in VS Code
        if: runner.os != 'Linux'
        shell: bash
        run: node test/vscode/run.js extension.vsix core.vsix --out vscode-results
      - name: Say what the daily run checks
        if: failure() && github.event_name == 'schedule'
        shell: bash
        run: echo "::error::The daily run builds against Agent Plus's newest commit and installs the newest Codex released. Run this workflow by hand with agent_plus latest, or with codex latest, to see which one this extension needs fitting to; pushes are not held up by it."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-${{ runner.os }}-${{ matrix.shard }}
          path: vscode-results
          if-no-files-found: warn
